<!DOCTYPE html>
<html lang="ur">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Happy Birthday Meri Jaan Alisha</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
        }

        .container {
            text-align: center;
            z-index: 10;
            padding: 20px;
        }

        .birthday-text {
            font-size: 4rem;
            color: #fff;
            text-shadow: 0 0 20px rgba(255, 255, 255, 0.5),
                         0 0 40px rgba(255, 182, 193, 0.8),
                         0 0 60px rgba(255, 105, 180, 0.6);
            animation: glow 2s ease-in-out infinite alternate;
            margin-bottom: 20px;
            font-weight: bold;
        }

        .name-text {
            font-size: 6rem;
            background: linear-gradient(45deg, #ff6b6b, #feca57, #48dbfb, #ff9ff3);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            animation: rainbow 3s linear infinite;
            margin: 20px 0;
            font-weight: bold;
        }

        .subtitle {
            font-size: 2rem;
            color: #ffeaa7;
            margin-top: 30px;
            animation: fadeInUp 2s ease;
        }

        .heart {
            position: absolute;
            color: #ff6b6b;
            font-size: 20px;
            animation: float 6s ease-in-out infinite;
            opacity: 0.6;
        }

        @keyframes glow {
            from {
                text-shadow: 0 0 20px rgba(255, 255, 255, 0.5),
                             0 0 40px rgba(255, 182, 193, 0.8);
            }
            to {
                text-shadow: 0 0 30px rgba(255, 255, 255, 0.8),
                             0 0 60px rgba(255, 182, 193, 1),
                             0 0 80px rgba(255, 105, 180, 0.8);
            }
        }

        @keyframes rainbow {
            0% { filter: hue-rotate(0deg); }
            100% { filter: hue-rotate(360deg); }
        }

        @keyframes float {
            0%, 100% { transform: translateY(0) rotate(0deg); }
            50% { transform: translateY(-20px) rotate(10deg); }
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .btn {
            display: inline-block;
            margin-top: 50px;
            padding: 15px 40px;
            background: linear-gradient(45deg, #ff6b6b, #ee5a6f);
            color: white;
            text-decoration: none;
            border-radius: 50px;
            font-size: 1.2rem;
            font-weight: bold;
            box-shadow: 0 10px 30px rgba(238, 90, 111, 0.4);
            transition: transform 0.3s, box-shadow 0.3s;
            animation: pulse 2s infinite;
        }

        .btn:hover {
            transform: translateY(-5px);
            box-shadow: 0 15px 40px rgba(238, 90, 111, 0.6);
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }

        .confetti {
            position: absolute;
            width: 10px;
            height: 10px;
            background: #feca57;
            animation: confetti-fall 3s linear infinite;
        }

        @keyframes confetti-fall {
            0% { transform: translateY(-100vh) rotate(0deg); opacity: 1; }
            100% { transform: translateY(100vh) rotate(720deg); opacity: 0; }
        }

        @media (max-width: 768px) {
            .birthday-text { font-size: 2.5rem; }
            .name-text { font-size: 3.5rem; }
            .subtitle { font-size: 1.5rem; }
        }
    </style>
</head>
<body>
    <!-- Floating Hearts -->
    <div class="heart" style="top: 10%; left: 10%; animation-delay: 0s;">❤️</div>
    <div class="heart" style="top: 20%; right: 15%; animation-delay: 1s;">💕</div>
    <div class="heart" style="top: 60%; left: 5%; animation-delay: 2s;">💖</div>
    <div class="heart" style="top: 70%; right: 10%; animation-delay: 3s;">💗</div>
    <div class="heart" style="top: 40%; left: 20%; animation-delay: 4s;">💝</div>
    <div class="heart" style="top: 80%; right: 30%; animation-delay: 5s;">💘</div>

    <!-- Confetti -->
    <div class="confetti" style="left: 10%; animation-delay: 0s;"></div>
    <div class="confetti" style="left: 30%; animation-delay: 0.5s; background: #ff6b6b;"></div>
    <div class="confetti" style="left: 50%; animation-delay: 1s; background: #48dbfb;"></div>
    <div class="confetti" style="left: 70%; animation-delay: 1.5s; background: #ff9ff3;"></div>
    <div class="confetti" style="left: 90%; animation-delay: 2s; background: #feca57;"></div>

    <div class="container">
        <div class="birthday-text">🎂 Happy Birthday 🎂</div>
        <div class="name-text">Meri Jaan Alisha</div>
        <div class="subtitle">✨ Tumhari Muskurahat Meri Zindagi Hai ✨</div>
        <a href="song.html" class="btn">Next Page →</a>
    </div>

    <script>
        // Create more floating hearts dynamically
        function createHeart() {
            const heart = document.createElement('div');
            heart.className = 'heart';
            heart.innerHTML = ['❤️', '💕', '💖', '💗', '💝', '💘'][Math.floor(Math.random() * 6)];
            heart.style.left = Math.random() * 100 + '%';
            heart.style.top = Math.random() * 100 + '%';
            heart.style.animationDelay = Math.random() * 5 + 's';
            heart.style.fontSize = (Math.random() * 20 + 15) + 'px';
            document.body.appendChild(heart);

            setTimeout(() => heart.remove(), 10000);
        }

        setInterval(createHeart, 2000);
    </script>
</body>
</html>
